# ELEVATE Orders — Shopify Partner app (non-embedded)
# Link this file with: shopify app config link
# Set client_id to your Partner app API key (same as SHOPIFY_API_KEY).

name = "ELEVATE Orders"
client_id = "REPLACE_WITH_SHOPIFY_API_KEY"
application_url = "https://elevate-orders.vercel.app"
embedded = false

[access_scopes]
scopes = "read_orders,read_customers,read_products"

[auth]
redirect_urls = [
  "https://elevate-orders.vercel.app/auth/shopify/callback",
  "https://elevate-orders.vercel.app/auth/shopify"
]

[webhooks]
api_version = "2025-01"

  [[webhooks.subscriptions]]
  topics = ["orders/create", "orders/updated", "orders/cancelled", "app/uninstalled"]
  uri = "/api/public/webhooks/shopify"

  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/api/public/webhooks/shopify"

[pos]
embedded = false
